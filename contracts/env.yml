# ═══════════════════════════════════════════════════════════════
# contracts/env.yml — Environment variable completeness
# ═══════════════════════════════════════════════════════════════
# Every env var referenced in compose files (via ${VAR} or environment:
# blocks) must have a default in .env.example.

name: env-completeness
description: >
  All environment variables referenced in compose files must be defined
  in .env.example with a default value. This prevents runtime failures
  from missing variables.
severity: error

rules:
  - type: env-defined
    target: .env.example
    compose_files:
      - docker-compose.yml
      - idm/zitadel.yml
      - idm/casdoor.yml
      - opencloud/opencloud.yml
      - opencloud/minio.yml
      - mail/stalwart.yml
      - mail/sogo.yml
      - services/invoice-ninja.yml
      - services/paperless.yml
      - services/cryptpad.yml
      - services/synapse.yml
      - services/element.yml
      - services/notes.yml
      - monitoring/dev-agent.yml
      - monitoring/predictive-agent.yml
      - monitoring/ollama.yml
      - monitoring/taskfleet.yml
    # Meta-variables that are not service env vars
    ignore:
      - COMPOSE_FILE
      - OPENSME_DOMAIN   # used in Traefik label Host() rules, has defaults
      - EXISTING_NETWORK
      - EXISTING_TRAEFIK_HTTPS
