# ═══════════════════════════════════════════════════════════════
# contracts/networks.yml — Network isolation
# ═══════════════════════════════════════════════════════════════
# All services must be on the opendesk-net network (not host mode).
# This ensures service-to-service communication via Docker DNS names
# and prevents direct host access.

name: network-isolation
description: >
  All services must be connected to the opendesk-net bridge network.
  No service may use host network mode. This ensures isolation and
  DNS-based service discovery.
severity: error

rules:
  - type: on-network
    network: opendesk-net
    services:
      - traefik
      - postgres
      - pgbouncer
      - redis
      - memcached
      - portal
      - zitadel
      - casdoor
      - opencloud
      - collabora
      - minio
      - stalwart
      - sogo
      - invoiceninja
      - paperless-ngx
      - paperless-gotenberg
      - paperless-tika
      - cryptpad
      - synapse
      - element-web
      - notes-backend
      - notes-frontend
      - notes-y-provider
      - dev-agent
      - predictive-agent
      - ollama
      - taskfleet

  - type: no-host-network
    description: "No service may use network_mode: host"
