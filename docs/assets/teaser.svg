<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="60%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#102e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f7ff2"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55a3fb"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#55a3fb" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#55a3fb" stroke-width="0.5"/>
  </g>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Building icon (left side) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <!-- Building outline -->
    <rect x="0" y="20" width="80" height="140" rx="6" fill="#0c1626" stroke="#2f7ff2" stroke-width="2"/>
    <!-- Windows -->
    <rect x="14" y="36" width="16" height="16" rx="2" fill="#2f7ff2" opacity="0.8"/>
    <rect x="42" y="36" width="16" height="16" rx="2" fill="#2dd4bf" opacity="0.6"/>
    <rect x="14" y="66" width="16" height="16" rx="2" fill="#2dd4bf" opacity="0.6"/>
    <rect x="42" y="66" width="16" height="16" rx="2" fill="#2f7ff2" opacity="0.8"/>
    <rect x="14" y="96" width="16" height="16" rx="2" fill="#2f7ff2" opacity="0.8"/>
    <rect x="42" y="96" width="16" height="16" rx="2" fill="#2dd4bf" opacity="0.6"/>
    <!-- Door -->
    <rect x="28" y="128" width="24" height="32" rx="2" fill="#1f63d9" opacity="0.7"/>
    <!-- Antenna -->
    <line x1="40" y1="5" x2="40" y2="20" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="40" cy="3" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Title block -->
  <g transform="translate(180, 90)">
    <!-- Logo text -->
    <text x="0" y="48" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="url(#accent2)" letter-spacing="-1.5">openSME</text>

    <!-- Tagline -->
    <text x="0" y="82" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#e3ecff">Self-hosted digital workplace for small &amp; medium enterprises</text>
    <text x="0" y="110" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#9fb4d8">Docker Compose-based · IAM · File Sync · Mail · Groupware · Online Office</text>
  </g>

  <!-- Feature pills (right side) -->
  <g transform="translate(720, 200)" filter="url(#shadow)">
    <!-- Pill 1: Scale -->
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#0c1626" stroke="#2f7ff2" stroke-width="1" opacity="0.9"/>
    <text x="60" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8abfff">5 → 500 users</text>

    <!-- Pill 2: Self-hosted -->
    <rect x="130" y="0" width="110" height="32" rx="16" fill="#0c1626" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>
    <text x="185" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">Self-hosted</text>

    <!-- Pill 3: Open source -->
    <rect x="250" y="0" width="120" height="32" rx="16" fill="#0c1626" stroke="#2f7ff2" stroke-width="1" opacity="0.9"/>
    <text x="310" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8abfff">AGPL v3 free ≤50</text>

    <!-- Pill 4: Docker -->
    <rect x="380" y="0" width="100" height="32" rx="16" fill="#0c1626" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>
    <text x="430" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">Docker</text>
  </g>

  <!-- Architecture dots (bottom) -->
  <g transform="translate(180, 300)" opacity="0.5">
    <circle cx="0" cy="0" r="6" fill="#2f7ff2"/>
    <line x1="6" y1="0" x2="54" y2="0" stroke="#2f7ff2" stroke-width="1" opacity="0.4"/>
    <circle cx="60" cy="0" r="6" fill="#2dd4bf"/>
    <line x1="66" y1="0" x2="114" y2="0" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="0" r="6" fill="#2f7ff2"/>
    <line x1="126" y1="0" x2="174" y2="0" stroke="#2f7ff2" stroke-width="1" opacity="0.4"/>
    <circle cx="180" cy="0" r="6" fill="#2dd4bf"/>
    <line x1="186" y1="0" x2="234" y2="0" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
    <circle cx="240" cy="0" r="6" fill="#2f7ff2"/>
    <line x1="246" y1="0" x2="294" y2="0" stroke="#2f7ff2" stroke-width="1" opacity="0.4"/>
    <circle cx="300" cy="0" r="6" fill="#2dd4bf"/>
  </g>

  <!-- Bottom tagline -->
  <text x="180" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#475569">Traefik · Zitadel · OpenCloud · Collabora · Stalwart · SOGo · PostgreSQL · Redis</text>
</svg>
