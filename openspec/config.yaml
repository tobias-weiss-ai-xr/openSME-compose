schema: spec-driven

# Project context: shown to AI when creating artifacts.
context: |
  openSME — Docker Compose deployment of openSME for small/medium
  enterprises. Runs the same Zendis container images as the K3s production
  deployment, but directly via Docker (no Kubernetes).

  Stack: Docker Compose (profiles: soho/small/medium), Traefik, PostgreSQL,
  Zitadel/Casdoor (OIDC SSO), Redis, Stalwart Mail, SOGo Webmail, OpenCloud
  Files, Invoice Ninja, Paperless-ngx, monitoring agents (dev-agent,
  predictive-agent), taskfleet orchestration.

  Layout:
    docker-compose.yml            core services + profiles/ overlays
    idm/                          identity (zitadel.yml, casdoor.yml)
    mail/                         stalwart.yml, sogo.yml
    opencloud/                    opencloud.yml, minio.yml
    services/                     paperless, invoice-ninja, notes, synapse
    monitoring/                   dev-agent, predictive-agent, ollama, taskfleet
    tests/                        run.py — 7-layer test pyramid (00-static .. 06-security)
    ansible/                      docker_host role (soho/small/medium tiers)

  Constraints:
    - Public GitHub repo: MUST NOT contain internal hostnames, IPs, domains,
      or secrets (CI secret-scan + leak-scan gates enforce this).
    - Centralized SSO is mandatory — all services authenticate via one OIDC IDM.
    - Images from registry.opencode.de (Zendis) where available; else public.
    - Profiles: soho (4c/8G), small (8c/24G), medium (16c/48G).
    - SMEs need Invoicing, Documents, Mail, Webmail, Files, SSO — NOT edu.

rules:
  proposal:
    - Keep proposals focused on what SMEs need vs what can be stripped down
    - No internal references (hostnames, IPs, domains, secrets)
  design:
    - Document memory/RAM budgets for every new container
    - Every service must integrate with centralized SSO unless explicitly exempted
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task carries an acceptance gate

operations:
  apply:
    guidance:
      - Keep changes minimal and scoped to each task
      - Run the 7-layer test runner (python3 tests/run.py --static) after each task
  archive:
    guidance:
      - Summarize the archive outcome before finishing
