# ═════════════════════════════════════════════════
# openSME — Coexist Profile
# ═══════════════════════════════════════════════════
# Piggybacks on an EXISTING Traefik instance (no second Traefik).
# Use when another Docker Compose project already owns ports 80/443.
#
# Requirements:
#   - An existing Traefik is running with exposedByDefault=false
#   - Its Docker network is accessible (default: traefik-web)
#   - Its HTTPS entrypoint name is configurable (default: websecure)
#
# What this does:
#   - Disables our Traefik (the existing one handles routing + TLS)
#   - Moves all services to the existing Traefik's Docker network
#   - Rewrites all Traefik labels to use existing entrypoint names
#   - Removes port 80/443 bindings and dashboard labels
#
# Env vars:
#   EXISTING_NETWORK       Docker network name (default: traefik-web)
#   EXISTING_TRAEFIK_HTTPS HTTPS entrypoint name (default: websecure)
#
# Use:
#   EXISTING_NETWORK=traefik-web docker compose \
#     -f docker-compose.yml -f idm/zitadel.yml -f opencloud/opencloud.yml \
#     -f profiles/demo.live.yml -f profiles/demo.coexist.yml up -d
# ═══════════════════════════════════════════════════

# Network: join the existing Traefik's Docker network.
# Find it: docker inspect <traefik-container> --format '{{range $n, $_ := .NetworkSettings.Networks}}{{$n}}'
networks:
  opensme-net:
    name: ${EXISTING_NETWORK:-traefik-web}
    external: true

services:
  # ── Disable our Traefik entirely ───────────────
  traefik:
    profiles:
      - donotstart

  # ── PostgreSQL ────────────────────────────────
  postgres:
    networks: []

  # ── Redis ────────────────────────────────────
  redis:
    networks: []

  # ── Memcached ──────────────────────────────
  memcached:
    networks: []

  # ── Portal ───────────────────────────────────
  portal:
    networks: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensme-portal.rule=Host(`${PORTAL_DOMAIN:-portal.opensme.org}`)"
      - "traefik.http.routers.opensme-portal.tls=true"
      - "traefik.http.routers.opensme-portal.entrypoints=${EXISTING_TRAEFIK_HTTPS:-websecure}"
      - "traefik.http.services.opensme-portal.loadbalancer.server.port=8080"

  # ── Zitadel ────────────────────────────────
  zitadel:
    networks: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensme-zitadel.rule=Host(`${ZITADEL_DOMAIN:-auth.opensme.org}`)"
      - "traefik.http.routers.opensme-zitadel.tls=true"
      - "traefik.http.routers.opensme-zitadel.entrypoints=${EXISTING_TRAEFIK_HTTPS:-websecure}"
      - "traefik.http.services.opensme-zitadel.loadbalancer.server.port=8080"

  # ── LDAP (legacy, not used with Zitadel) ──
  # ldap:
  #   networks: []

  # ── OpenCloud ──────────────────────────────
  opencloud:
    networks: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensme-opencloud.rule=Host(`${OPENCLOUD_DOMAIN:-cloud.opensme.org}`)"
      - "traefik.http.routers.opensme-opencloud.tls=true"
      - "traefik.http.routers.opensme-opencloud.entrypoints=${EXISTING_TRAEFIK_HTTPS:-websecure}"
      - "traefik.http.services.opensme-opencloud.loadbalancer.server.port=9200"
