# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── SOGo Groupware overlay ─────────────────────
# Include via: COMPOSE_FILE=docker-compose.yml:mail/sogo.yml
# Webmail, calendar, contacts (connects to Stalwart IMAP/SMTP).
#
# Config is rendered from sogo.conf.template at startup.
# Required env vars: SOGO_DB_PASSWORD, LDAP_ROOT_DN, LDAP_ADMIN_PASSWORD,
#                    OPENSME_DOMAIN, TZ

services:
  sogo:
    <<: *service-defaults
    image: ${SOGO_IMAGE:-salvoxia/sogo:latest}
    container_name: opensme-sogo
    restart: unless-stopped
    stop_grace_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      stalwart:
        condition: service_healthy
    volumes:
      - ./mail/sogo/sogo.conf.template:/etc/sogo/sogo.conf.template:ro
      - ./mail/sogo/sogo-entrypoint.sh:/sogo-entrypoint.sh:ro
      - sogo-config:/etc/sogo
      - sogo-data:/srv
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SOGO_DB_PASSWORD: ${SOGO_DB_PASSWORD:-CHANGEME_sogo}
      LDAP_ROOT_DN: ${LDAP_ROOT_DN:-dc=opensme,dc=org}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-CHANGEME_ldap}
      OPENSME_DOMAIN: ${OPENSME_DOMAIN:-opensme.org}
    entrypoint: ["/sogo-entrypoint.sh"]
    command: ["sogod"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20000/SOGo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sogo.rule=Host(`${SOGO_DOMAIN:-webmail.opensme.org}`) && PathPrefix(`/SOGo`)"
      - "traefik.http.routers.sogo.tls=true"
      - "traefik.http.routers.sogo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sogo.entrypoints=websecure"
      - "traefik.http.services.sogo.loadbalancer.server.port=20000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  sogo-config:
  sogo-data:
