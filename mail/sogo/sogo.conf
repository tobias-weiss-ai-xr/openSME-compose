// SOGo Groupware — production config for up to 500 users
// Connects to Stalwart via IMAP/SMTP, PostgreSQL via PgBouncer.
//
// IMPORTANT: This is a template. In production, replace:
//   CHANGEME_sogo       → actual PostgreSQL password (from .env SOGO_DB_PASSWORD)
//   CHANGEME_ldap       → actual LDAP admin password (from .env LDAP_ADMIN_PASSWORD)
//   dc=opensme,dc=org → match your LDAP_ROOT_DN

{
  // Server
  WOPort = 20000;
  WOHTTPEnabled = YES;
  WOLogFile = /var/log/sogo/sogo.log;
  SOPidFile = /var/run/sogo/sogo.pid;
  WOWorkersCount = 8;

  // Database via PgBouncer (transaction pooling)
  // NOTE: Requires 'sogo' database to exist in PostgreSQL.
  //       Create it: docker compose exec postgres psql -U opensme -c "CREATE DATABASE sogo;"
  OCSFolderInfoURL = "postgresql://opensme:CHANGEME_sogo@pgbouncer:5432/sogo/sogo_folder_info";
  OCSSessionsFolderURL = "postgresql://opensme:CHANGEME_sogo@pgbouncer:5432/sogo/sogo_sessions_folder";
  OCSStoreURL = "postgresql://opensme:CHANGEME_sogo@pgbouncer:5432/sogo/sogo_store";
  OCSACLsURL = "postgresql://opensme:CHANGEME_sogo@pgbouncer:5432/sogo/sogo_acl";
  OCSLanguagesURL = "postgresql://opensme:CHANGEME_sogo@pgbouncer:5432/sogo/sogo_languages";

  // Authentication via LDAP
  SOGoUserSources = (
    {
      type = ldap;
      CNFieldName = cn;
      UIDFieldName = uid;
      IDFieldName = uid;
      bindDN = "cn=admin,dc=opensme,dc=org";
      bindFields = (uid, mail);
      bindPassword = "CHANGEME_ldap";
      baseDN = "dc=opensme,dc=org";
      canAuthenticate = YES;
      displayName = "openSME Users";
      hostname = "ldap";
      id = "opensme-ldap";
      port = 389;
      cacheTimeout = 300;
    }
  );

  // Mail (via Stalwart)
  SOGoDraftsFolderName = Drafts;
  SOGoSentFolderName = Sent;
  SOGoTrashFolderName = Trash;
  SOGoJunkFolderName = Junk;
  SOGoMailDomain = "opensme.org";
  SOGoIMAPServer = "stalwart";
  SOGoSMTPServer = "stalwart";
  SOGoSMTPAuthenticationType = PLAIN;
  SOGoForceExternalLoginWithEmail = NO;
  SOGoMailSpoolPath = "/tmp";

  // Performance
  SOGoMaximumSyncWindowSize = 100;
  SOGoConnectionsPoolSize = 20;
  SOGoPendingDropBoxEnabled = YES;
  SOGoPendingDropBoxSizeLimit = 50;
  SOGoPendingMailDropBoxSizeLimit = 50;

  // General
  SOGoTimeZone = "Europe/Berlin";
  SOGoDefaultUser = "user01";
  SOGoLanguage = German;
  SOGoAppointmentSendEMailNotifications = YES;

  // Calendar & Contacts
  SOGoEnablePublicAccess = NO;
  SOGoFreeBusyDefaultInterval = 600;
  SOGoFreeBusyPublishInterval = 60;

  // Security
  SOXHeaderEnabled = NO;
}
