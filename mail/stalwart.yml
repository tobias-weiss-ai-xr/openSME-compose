# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── Stalwart Mail Server overlay ───────────────
# Include via: COMPOSE_FILE=docker-compose.yml:mail/stalwart.yml
# Rust-based mail server: SMTP, IMAP, JMAP, CalDAV, CardDAV.
#
# Config is rendered from config.toml.template at startup.

services:
  stalwart:
    <<: *service-defaults
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart:v0.15.0}
    container_name: opensme-stalwart
    hostname: mail.${OPENSME_DOMAIN:-opensme.org}
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      # 465/993 implicit-TLS listeners need certificates; TLS is terminated by Traefik
    environment:
      TZ: Europe/Berlin
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.opensme.org}
      STALWART_PUBLIC_URL: https://${MAIL_DOMAIN:-mail.opensme.org}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-CHANGEME_stalwart_admin}
    volumes:
      - stalwart-etc:/opt/stalwart/etc
      - stalwart-data:/var/lib/stalwart
      - ./mail/stalwart/config.toml.template:/etc/stalwart/config.toml.template:ro
      - ./mail/stalwart/stalwart-entrypoint.sh:/stalwart-entrypoint.sh:ro
    entrypoint: ["/stalwart-entrypoint.sh"]
    command: ["stalwart", "--config", "/opt/stalwart/etc/config.toml"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart.rule=Host(`${MAIL_DOMAIN:-mail.opensme.org}`)"
      - "traefik.http.routers.stalwart.tls=true"
      - "traefik.http.routers.stalwart.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stalwart.entrypoints=websecure"
      - "traefik.http.services.stalwart.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  stalwart-etc:
  stalwart-data:
