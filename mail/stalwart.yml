# ── Stalwart Mail Server overlay ───────────────
# Include via: COMPOSE_FILE=docker-compose.yml:mail/stalwart.yml
# Rust-based mail server: SMTP, IMAP, JMAP, CalDAV, CardDAV

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: opensme-stalwart
    hostname: mail.${OPENSME_DOMAIN:-opensme.org}
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      TZ: Europe/Berlin
      STALWART_PUBLIC_URL: https://${MAIL_DOMAIN:-mail.opensme.org}
      STALWART_RECOVERY_ADMIN: admin:${STALWART_ADMIN_PASSWORD:-}
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      - ./mail/stalwart/config.toml:/etc/stalwart/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensme-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart.rule=Host(`${MAIL_DOMAIN:-mail.opensme.org}`)"
      - "traefik.http.routers.stalwart.tls=true"
      - "traefik.http.routers.stalwart.tls.certresolver=letsencrypt"
      - "traefik.http.services.stalwart.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  stalwart-etc:
  stalwart-data:
