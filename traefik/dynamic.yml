# openSME — Traefik dynamic config (file provider, mounted read-only)
# Rate limiting for the web entrypoints (average 100 req/s, burst 200).
http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 100
        burst: 200
# ── BEGIN MAILCOW ROUTER (managed by scripts/mailcow.sh) ──
  routers:
    mailcow-ui:
      rule: "Host(`mail.opensme.local`)"
      entrypoints: [websecure]
      service: mailcow-web
      tls: {}
  services:
    mailcow-web:
      loadBalancer:
        servers:
          - url: "http://nginx-mailcow:28080"
# ── END MAILCOW ROUTER ──
