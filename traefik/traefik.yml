# ──────────────────────────────────────────────
# Traefik v3 — static configuration
# ──────────────────────────────────────────────

api:
  dashboard: true
  debug: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: opensme-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Let's Encrypt (enable by setting TRAEFIK_ACME_ENABLED=true)
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL:-admin@opensme.org}
      storage: /etc/traefik/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

# HTTP/2 + 3
experimental:
  http3: true
