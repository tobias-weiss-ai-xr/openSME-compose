# ═══════════════════════════════════════════════════════════════
# specs/core.yml — Core services (docker-compose.yml)
# ═══════════════════════════════════════════════════════════════
# Always-on services: Traefik, PostgreSQL, PgBouncer, Redis, Memcached, Portal.
# These form the foundation; all other services are overlays.

services:
  traefik:
    image: traefik:v3.7.13
    compose_file: docker-compose.yml
    required: true
    profiles: [standalone]
    host_ports: [80, 443]
    healthcheck: false
    networks: [opensme-net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/etc/traefik
    env: []
    traefik_labels: true
    resource_limits:
      memory: 256M

  postgres:
    image: postgres:17
    compose_file: docker-compose.yml
    required: true
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    env: [POSTGRES_PASSWORD, POSTGRES_USER, POSTGRES_DB]
    traefik_labels: false
    resource_limits:
      memory: 4G

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-bitnamilegacy/pgbouncer:latest}
    compose_file: docker-compose.yml
    required: true
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    env:
      - POSTGRESQL_HOST
      - POSTGRESQL_PORT
      - POSTGRESQL_USERNAME
      - POSTGRESQL_PASSWORD
      - POSTGRESQL_DATABASE
    traefik_labels: false
    resource_limits:
      memory: 256M

  redis:
    image: redis:alpine
    compose_file: docker-compose.yml
    required: true
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    volumes:
      - redis-data:/data
    env: []
    traefik_labels: false
    resource_limits:
      memory: 4G

  memcached:
    image: memcached:alpine
    compose_file: docker-compose.yml
    required: true
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    env: []
    traefik_labels: false
    resource_limits:
      memory: 2G

  portal:
    image: null  # build context: ./portal
    compose_file: docker-compose.yml
    required: true
    host_ports: []
    healthcheck: true
    networks: [opensme-net]
    depends_on: [postgres]
    env:
      - PORTAL_DOMAIN
      - OPENSME_DOMAIN
      - OPENCLOUD_URL
      - IDP_URL
      - RUST_LOG
    traefik_labels: true
    resource_limits:
      memory: 128M
