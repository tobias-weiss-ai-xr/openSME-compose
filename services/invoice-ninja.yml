# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ═══════════════════════════════════════════════════════════════
# openSME — Invoice Ninja
# ═══════════════════════════════════════════════════════════════
# Invoicing and billing for SMEs.
# Include via: COMPOSE_FILE=docker-compose.yml:services/invoice-ninja.yml
# Or via profile: docker compose --profile invoice up -d
#
# Requires: PostgreSQL (core), Stalwart (for email notifications)
# ═══════════════════════════════════════════════════════════════

services:
  # Invoiceninja's pgsql "support" is broken upstream (v5 migrations contain
  # MySQL-dialect SQL, e.g. `ALTER TABLE ... MODIFY COLUMN`) — give it the
  # officially supported MariaDB instead of the shared postgres.
  invoiceninja-db:
    <<: *service-defaults
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: opensme-invoiceninja-db
    restart: unless-stopped
    profiles: ["invoice"]
    command: --transaction-isolation=READ-COMMITTED --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE: invoiceninja_db
      MARIADB_USER: invoiceninja_user
      MARIADB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:-CHANGEME_invoiceninja}
      MARIADB_ROOT_PASSWORD: ${INVOICENINJA_DB_ROOT_PASSWORD:-CHANGEME_invoiceninja_root}
    volumes:
      - invoiceninja-db:/var/lib/mysql
    networks:
      - opensme-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  invoiceninja:
    <<: *service-defaults
    image: invoiceninja-pg:5
    # upstream image lacks pdo_pgsql — local build adds it (see Dockerfile);
    # harmless with MariaDB but keeps the pg option buildable
    build: ./services/invoice-ninja
    container_name: opensme-invoiceninja
    restart: unless-stopped
    profiles: ["invoice"]
    environment:
      APP_URL: "https://invoices.${OPENSME_DOMAIN:-opensme.org}"
      APP_ENV: production
      DB_HOST: invoiceninja-db
      DB_PORT: "3306"
      DB_DATABASE: invoiceninja_db
      DB_USERNAME: invoiceninja_user
      DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD:-CHANGEME_invoiceninja}
      DB_TYPE: mysql
      # Laravel reads DB_CONNECTION (DB_TYPE is a invoiceninja-doc but
      # dead name — without this it defaults to the mysql driver)
      DB_CONNECTION: mysql
      MAIL_MAILER: smtp
      MAIL_HOST: stalwart
      MAIL_PORT: "25"
      MAIL_ENCRYPTION: ""
      REQUIRE_CONFIRMATION: "false"
      SET_UNCONFIRMED: "true"
      SELF_UPDATE: "false"
    volumes:
      - invoiceninja-public:/var/www/app/public
      - invoiceninja-storage:/var/www/app/storage
    networks:
      - opensme-net
    depends_on:
      invoiceninja-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # fpm image: no HTTP on :9000 (FastCGI) — just check the process
      test: ["CMD", "pgrep", "-f", "php-fpm"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # nginx front for the fpm container; serves the shared public volume and
  # forwards FastCGI to the "invoiceninja" service (default in the image)
  invoiceninja-web:
    <<: *service-defaults
    image: ${INVOICENINJA_NGINX_IMAGE:-invoiceninja/nginx:5}
    container_name: opensme-invoiceninja-web
    restart: unless-stopped
    profiles: ["invoice"]
    volumes:
      - invoiceninja-public:/var/www/app/public:ro
    networks:
      - opensme-net
    depends_on:
      invoiceninja:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invoices.rule=Host(`invoices.${OPENSME_DOMAIN:-opensme.org}`)"
      - "traefik.http.routers.invoices.tls=true"
      - "traefik.http.routers.invoices.tls.certresolver=letsencrypt"
      - "traefik.http.routers.invoices.entrypoints=websecure"
      - "traefik.http.services.invoices.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 32M

volumes:
  invoiceninja-public:
  invoiceninja-storage:
  invoiceninja-db:
