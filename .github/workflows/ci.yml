name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality (fmt + lint + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust (portal) ────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check (portal)
        run: cargo fmt --check
        working-directory: portal
      - name: cargo clippy -D warnings (portal)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: portal

      # ── Go (dev-agent) ───────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt (fail on drift)
        run: |
          drift=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$drift" ]; then echo "::error::unformatted Go files: $drift"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

      # ── Shell (scripts) ──────────────────────────────────
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck (scripts)
        run: shellcheck scripts/*.sh

  static:
    name: Static validation + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Secret scan (Layer 0)
        # Hardcoded secrets / passwords / API keys, plus RFC1918 & link-local
        # IPs that must never ship to this public repo. Exit 1 on any hit.
        run: python3 tests/00-static/scan_secrets.py

      - name: Full static suite (Layers 0-2)
        # YAML lint, .env completeness, secret scan, spec compliance,
        # contract validation. No running stack required.
        run: python3 tests/run.py --static

  leak-scan:
    name: Generic internal-ref scan (defense in depth)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan working tree for private-network refs
        # Defense-in-depth layer: catches private-network IPs and host
        # filesystem paths in ANY tracked file (including .md, which the
        # secret scanner also now covers). Deliberately uses NO named internal
        # hostnames so this file can never re-leak them.
        shell: bash
        run: |
          set -u
          FAIL=0
          while IFS= read -r -d '' f; do
            # Documented non-leaks, verified by hand:
            #  - vendored dependency tests (node_modules) contain upstream
            #    unit-test fixtures with private-range IPv4 literals
            #  - *_test.go / *_test.py canary fixtures deliberately embed
            #    private IPs and fake secrets to test the redactor
            case "$f" in
              */node_modules/*|*_test.go|*_test.py) continue ;;
            esac
            # RFC1918 10/8 — full dotted-quad only (avoids numeric literals)
            if grep -E '\b10\.([0-9]{1,3}\.){2}[0-9]{1,3}\b' "$f" 2>/dev/null; then
              echo "::error::RFC1918 10/8 IP in $f"; FAIL=1
            fi
            # RFC1918 192.168/16, 172.16-31/12, link-local 169.254/16
            if grep -E '\b192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.' "$f" 2>/dev/null; then
              echo "::error::private/link-local IPv4 in $f"; FAIL=1
            fi
            # Host filesystem paths (require a component after the username so
            # container home dirs like /home/opensme are not flagged).
            # /srv/etc is the SOGo container's config dir on its volume, not
            # a host path (mail/sogo/sogo-entrypoint.sh).
            if grep -E '(/home|/Users|/srv)/[a-zA-Z0-9_.-]+/' "$f" 2>/dev/null \
              | grep -v '/srv/etc/' 2>/dev/null \
              | grep -q .; then
              echo "::error::host filesystem path in $f"; FAIL=1
            fi
          done < <(git ls-files -z)
          exit $FAIL

  e2e:
    name: E2E — SSO flows (demo stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Heavy job: builds the portal (rust) and boots the demo stack.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Provision deploy-time Zitadel artifacts (masterkey + busybox)
        # Both are gitignored and normally created by the ansible deploy role.
        # The masterkey must be exactly 32 bytes with no trailing newline
        # (`openssl rand -base64 32` yields 44 chars + newline → rejected).
        run: |
          printf '%s' "$(openssl rand -base64 24)" > idm/secrets/masterkey
          mkdir -p idm/zitadel
          cid=$(docker create busybox:stable-musl true)
          docker cp "$cid":/bin/busybox idm/zitadel/busybox
          docker rm "$cid" >/dev/null
          chmod +x idm/zitadel/busybox

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-build portal image (GHA layer cache)
        # Build once with registry→GHA layer caching; demo.sh then skips its
        # own --build (PORTAL_SKIP_BUILD=1). Cuts ~1min of rust deps compile
        # per run — the cache reuses them unless Cargo.lock moves.
        run: |
          CF="-f docker-compose.yml -f idm/zitadel.yml -f opencloud/opencloud.yml -f profiles/demo.dev.yml"
          # build-only services carry no image key in `config` output; compose
          # tags them {project}-{service} — resolve the project name the same
          # way compose does so demo.sh finds the prebuilt image.
          PROJ=$(docker compose $CF --env-file .env.example config --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          IMG="${PROJ}-portal"
          echo "portal image: $IMG"
          docker buildx build \
            --cache-from type=gha,scope=portal \
            --cache-to type=gha,scope=portal,mode=max \
            -t "$IMG" --load portal/

      - name: Boot demo stack (generates .env with random passwords)
        env:
          PORTAL_SKIP_BUILD: "1"
        run: bash scripts/demo.sh

      - name: Wait for IdP and Portal
        run: |
          timeout 300 bash -c 'until curl -skf --resolve auth.opensme.local:443:127.0.0.1 \
            https://auth.opensme.local/debug/ready >/dev/null 2>&1; do sleep 5; done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 5; done'

      - name: Run e2e suite (Layer 5 — SSO flows)
        run: python3 tests/05-e2e/run.py opensme.local
