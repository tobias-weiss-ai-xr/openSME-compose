# ── Global defaults ──────────────────────────────────
# Inherited by every service in this file via: <<: *service-defaults
x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  init: true
  security_opt:
    - no-new-privileges:true

# ── taskfleet overlay — Parallel LLM task orchestration ───────
# taskfleet dispatches development tasks to LLM workers running in
# isolated git worktrees. It is NOT a long-running daemon — invoke it
# on demand via `docker compose run --rm taskfleet`.
#
# Usage:
#   # Run the orchestrator (one dispatch round)
#   docker compose --profile taskfleet run --rm taskfleet --once
#
#   # Show the status board
#   docker compose --profile taskfleet run --rm taskfleet --status
#
#   # Dispatch a specific task
#   docker compose --profile taskfleet run --rm taskfleet --task DA-06
#
#   # Attach to a running task
#   docker compose --profile taskfleet run --rm taskfleet attach TASK_ID
#
# Requires:
#   - TF_REPO_DIR set to the repo you want tasks to operate on
#   - Workers config at /config/workers.json
#   - Tasks config at /config/tasks.json
#   - `pi` binary on PATH (the LLM coding agent)
#   - `jq` and `git` available
#
# Environment:
#   TF_REPO_DIR       Repo path (default: /repo)
#   TF_MAX_PARALLEL   Max concurrent workers (default: number of enabled workers)
#   TF_MAX_ROUNDS     Max dispatch rounds (default: 0 = unlimited)
#   TF_AUTO_TIER      Auto-tier complexity (1 = on, 0 = off)
#   TF_AFFINITY       Worker selection (2 = UCB1, 1 = win-rate, 0 = config)
#   TF_LOCAL_ONLY     Block external API workers (1 = block, 0 = allow)

services:
  taskfleet:
    <<: *service-defaults
    image: ${TASKFLEET_IMAGE:-ghcr.io/tobias-weiss-ai-xr/taskfleet:latest}
    container_name: opendesk-taskfleet
    profiles: ["taskfleet"]
    restart: "no"
    # v2: npm `taskfleet` bin (native --help/--status/--dry-run/--version;
    # --once bridges to /opt/taskfleet/orchestrator.sh until native loop lands)
    entrypoint: ["/usr/bin/taskfleet"]
    volumes:
      # The repo to operate on (read-write — workers create worktrees)
      - ${TF_REPO_DIR:-./}:/repo
      # Task and worker configs
      - ./monitoring/taskfleet-config:/config:ro
      # Persistent state (worktrees, cache, history)
      - taskfleet-state:/var/lib/taskfleet
      # Docker socket (for building/testing inside worktrees)
      - /var/run/docker.sock:/var/run/docker.sock
      # Git config for worktree operations
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /repo
    environment:
      TF_REPO_DIR: /repo
      TF_MAX_PARALLEL: ${TF_MAX_PARALLEL:-2}
      TF_MAX_ROUNDS: ${TF_MAX_ROUNDS:-0}
      TF_AUTO_TIER: ${TF_AUTO_TIER:-1}
      TF_AFFINITY: ${TF_AFFINITY:-2}
      TF_ROUTING: ${TF_ROUTING:-1}
      TF_LOCAL_ONLY: ${TF_LOCAL_ONLY:-0}
      TF_CONFIG_DIR: /config
      TF_STATE_DIR: /var/lib/taskfleet
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - opendesk-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  taskfleet-state:
